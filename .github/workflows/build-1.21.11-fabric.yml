name: Build Fabric 1.21.11

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (21 for 1.21.11, 25 for Gradle's other version projects)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :1.21.11-fabric:build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-wynnfix-1.21.11-fabric
          path: |
            versions/1.21.11-fabric/build/libs/*.jar
            !versions/1.21.11-fabric/build/libs/*-sources.jar
          if-no-files-found: error
